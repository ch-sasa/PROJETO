<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEHE ❤</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="shortcut icon" href="dxtly.PNG" type="image/x-icon">
</head>

<body>

    <header class="topo">

        <a href="index.html" class="logo-link">
            <h1 class="logo">SA<span class="heart">❤</span>CH</h1>
        </a>

        <!-- PLAYER DE MÚSICA -->
        <div class="musica-header">

            <button class="botao-musica" id="botaoMusica" type="button">
                Música
            </button>

            <div class="caixa-musica">

                <div class="logo-musica">
                    SA<span class="heart">❤</span>CH
                </div>

                <h3 id="nomeMusica">Escolha uma música</h3>

                <!-- CONTROLES DA MÚSICA -->
                <div class="controles-musica">
                    <button class="controle-musica" id="voltarMusica" type="button">⏮</button>

                    <button class="controle-musica botao-play-pause" id="playPauseMusica" type="button">
                        ▶
                    </button>

                    <button class="controle-musica" id="proximaMusica" type="button">⏭</button>
                </div>

                <!-- LETRA SINCRONIZADA -->
                <div class="musica-letra" id="letraMusica">
                    Selecione uma música para ver a letra.
                </div>

                <div class="lista-musicas" id="listaMusicas"></div>

            </div>

            <audio id="musica"></audio>

        </div>

        <nav class="topo2">
            <button type="button" onclick="location.href='index.html'">Início</button>
            <button type="button" onclick="location.href='fotos.html'">Fotos</button>
            <button type="button" onclick="location.href='videos.html'">Vídeos</button>
        </nav>

    </header>

    <main class="conteudo">

        <div class="texto">
            <h1></h1>
            <p></p>
        </div>

    </main>

</body>

</html>
